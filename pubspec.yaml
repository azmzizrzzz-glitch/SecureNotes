name: secure_notes
description: A professional encrypted notes app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  
  # Storage & Security
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Media
  image_picker: ^1.0.4
  record: ^5.0.4
  audioplayers: ^5.2.1
  file_picker: ^6.1.1
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  
  # Utils
  intl: ^0.18.1
  share_plus: ^7.2.1
  path: ^1.8.3
  archive: ^3.4.9
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/
